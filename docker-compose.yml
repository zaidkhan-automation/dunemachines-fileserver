version: "3.9"

services:
  fileserver:
    build: .
    ports:
      - "8007:8007"
    environment:
      - DATABASE_URL=postgresql+asyncpg://fileserver:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/fileserver_db
      - REDIS_URL=redis://redis:6379/2
      - STORAGE_ENDPOINT=http://minio:9000
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - .:/app
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fileserver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: fileserver_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    restart: unless-stopped

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
